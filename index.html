<style>
  :root {
    color-scheme: light dark;
    --bg: #f1f5fa; --card: #ffffff; --ink: #0b1f33; --muted: #5b6b7d; --line: #dfe7f0;
    --brand: #004786; --brand-2: #00335f; --brand-ink: #ffffff; --sky: #009fe2; --link: #0077b3;
    --accent: #004786; --accent-ink: #ffffff; --accent-shadow: rgba(0,71,134,.28);
    --ok: #13803d; --warn: #b45309; --bad: #c0262d; --chip: #e5eef7; --field: #f7fafd;
    --shadow: 0 1px 2px rgba(0,40,80,.06), 0 6px 18px rgba(0,40,80,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #06131f; --card: #0c1f33; --ink: #e6eef6; --muted: #93a7bb; --line: #1c3450;
      --brand: #00335f; --brand-2: #00203d; --link: #4cc3f5;
      --accent: #009fe2; --accent-ink: #00203d; --accent-shadow: rgba(0,159,226,.25);
      --chip: #142c45; --field: #0a1a2b; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  .pbar { position: fixed; left: 0; right: 0; top: 0; height: calc(3px + env(safe-area-inset-top)); z-index: 100; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .pbar.on { opacity: 1; }
  .pbar::before { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 40%; border-radius: 3px; background: #009fe2; animation: pbar 1.1s ease-in-out infinite; }
  @keyframes pbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .pbar::before { animation: none; width: 100%; opacity: .7; } }
  body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 120px; }
  .hidden { display: none !important; }

  /* Header */
  .top { color: var(--brand-ink); padding: 18px 16px 52px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 105% -10%, rgba(0,159,226,.55) 0 28%, transparent 29%),
                radial-gradient(90% 70% at 110% -5%, rgba(0,159,226,.25) 0 45%, transparent 46%),
                linear-gradient(160deg, var(--brand) 0%, var(--brand-2) 100%); }
  .brandrow { display: flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 50%; flex: none; box-shadow: 0 2px 10px rgba(0,0,0,.25); background: #fff; }
  .login .logo { width: 92px; height: 92px; margin-bottom: 14px; }
  .top .in { max-width: 560px; margin: 0 auto; padding: 0 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .club { font-size: 13px; opacity: .75; letter-spacing: .02em; }
  .hello { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .iconbtn { background: rgba(255,255,255,.12); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 20px; cursor: pointer; }
  .menu { position: fixed; right: max(16px, calc((100vw - 560px) / 2)); top: calc(env(safe-area-inset-top) + 66px); background: var(--card); color: var(--ink); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18); overflow: hidden; z-index: 40; min-width: 200px; border: 1px solid var(--line); }
  .menu button { display: block; width: 100%; text-align: left; padding: 13px 16px; background: none; border: 0; cursor: pointer; }
  .menu button + button { border-top: 1px solid var(--line); }

  /* Kort */
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .summary { margin-top: -36px; padding: 16px; position: relative; z-index: 1; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }

  .chip.on { background: var(--sky); color: #fff; }
  .month { font-size: 14px; color: var(--muted); text-transform: capitalize; display: flex; justify-content: space-between; align-items: center; }
  .histbtn { border: 0; background: none; color: var(--link); font-weight: 700; font-size: 14px; cursor: pointer; padding: 4px 0; text-transform: none; }
  .note { color: var(--link); font-size: 13px; white-space: normal !important; }
  .histbtns { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
  .histbtns .btn { padding: 10px; font-size: 14px; }
  .monthbox { width: 100%; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .mrow { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 14px; }
  .mrow + .mrow { border-top: 1px solid var(--line); }
  .mrow .md { flex: 0 0 58px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mrow .mw { flex: 1; min-width: 0; }
  .mrow .mw small { color: var(--muted); }
  .mrow .mt { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .mrow .ma { flex: 0 0 86px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .yr { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; padding: 18px 4px 8px; }
  .badge.ok { background: #dcfce7; color: #166534; }
  .badge.sky { background: #e0f2fe; color: #075985; }
  @media (prefers-color-scheme: dark) { .badge.ok { background: #12391f; color: #86efac; } .badge.sky { background: #0b3550; color: #7dd3fc; } .badge.warn { background: #3d2a08; color: #fcd34d; } }
  .big { display: flex; align-items: baseline; gap: 14px; margin: 4px 0 6px; flex-wrap: wrap; }
  .big .h { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .big .kr { font-size: 18px; font-weight: 600; color: var(--muted); }
  .deadline { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sky); display: inline-block; }
  .dot.closed { background: var(--muted); }

  /* Faner */
  .tabs { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 12px; margin: 18px 0 10px; }
  .tab { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
  .tab.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  /* Liste */
  .list { padding: 4px 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .item + .item { border-top: 1px solid var(--line); }
  .date { width: 46px; text-align: center; flex: none; }
  .date b { display: block; font-size: 20px; line-height: 1.1; }
  .date span { font-size: 12px; color: var(--muted); }
  .what { flex: 1; min-width: 0; }
  .what .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .what .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { text-align: right; flex: none; }
  .amt b { display: block; }
  .amt span { font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-top: 3px; }
  .badge.warn { background: #fef3c7; color: #92400e; }
  .del { border: 0; background: none; color: var(--muted); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; flex: none; font-size: 17px; }
  .del.confirm { background: var(--bad); color: #fff; width: auto; padding: 0 10px; font-size: 13px; font-weight: 700; }
  .empty { text-align: center; padding: 28px 16px; color: var(--muted); }
  .empty p { margin: 0 0 14px; }

  /* Knapper og felter */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--chip); color: var(--ink); }
  .btn.link { background: none; color: var(--link); padding: 10px; width: auto; font-weight: 600; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .fab { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }
  .fab .btn { max-width: 528px; margin: 0 auto; display: flex; box-shadow: 0 6px 20px var(--accent-shadow); }
  label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
  .in-f { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--field); font-size: 16px; min-height: 48px; -webkit-appearance: none; appearance: none; }
  select.in-f { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 21px, calc(100% - 13px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  .in-f:focus { outline: 2px solid var(--sky); outline-offset: 0; border-color: transparent; }
  .pw { position: relative; }
  .pw button { position: absolute; right: 6px; top: 6px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 0 10px; cursor: pointer; }
  .err { color: var(--bad); font-size: 14px; margin-top: 12px; min-height: 1em; }
  .hint { color: var(--muted); font-size: 14px; }

  /* Login */
  .login { min-height: 100vh; display: flex; flex-direction: column; }
  .login .top { padding: 40px 16px 70px; text-align: center; }
  .login .top h1 { margin: 6px 0 0; font-size: 28px; }
  .login .card { margin-top: -44px; padding: 20px; position: relative; z-index: 1; }
  .rules { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; }
  .rules li { padding: 3px 0; color: var(--muted); }
  .rules li::before { content: "○"; display: inline-block; width: 22px; }
  .rules li.ok { color: var(--ok); }
  .foot a, .foot .histbtn { color: var(--link); }
  .rules li.ok::before { content: "✓"; font-weight: 800; }

  /* Ark (modal) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 94vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px; }
  .sheet header h2 { margin: 0; font-size: 20px; }
  .sheet .x { border: 0; background: var(--chip); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .pf-rate { background: var(--chip); border-radius: 14px; padding: 14px 16px; margin: 4px 0 14px; }
  .pf-rate .l { font-size: 13px; color: var(--muted); }
  .pf-rate .v { font-size: 30px; font-weight: 800; color: var(--link); }
  .pf-rate .s { font-size: 14px; margin-top: 2px; }
  .pf-list { display: grid; }
  .pf-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .pf-row span { color: var(--muted); }
  .pf-row b { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .pf-h { font-size: 15px; margin: 18px 0 4px; }
  .pf-ytd { padding: 6px 2px 4px; }
  .pf-ytd .v b { font-size: 20px; } .pf-ytd .v span { color: var(--muted); }
  .pf-ytd .bar { height: 8px; background: var(--chip); border-radius: 6px; margin: 8px 0 4px; overflow: hidden; }
  .pf-ytd .bar i { display: block; height: 100%; background: var(--sky); border-radius: 6px; }
  .pf-ytd .bar.near i { background: var(--warn); } .pf-ytd .bar.over i { background: var(--bad); }
  .pf-ytd .left { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .pf-ytd .s { font-size: 13px; color: var(--muted); margin-top: 4px; } .pf-ytd .s.warn { color: var(--bad); font-weight: 600; }
  .sheet .body { overflow-y: auto; padding: 0 16px 12px; -webkit-overflow-scrolling: touch; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
  .sheet footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card); }
  .sheet footer .sum { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 8px; }
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { flex: 1; }
  .btnrow .btn.primary { flex: 1.8; }
  .item.pending { opacity: .75; }
  .pend { font-size: 12px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .pend .spin { width: 12px; height: 12px; border-width: 2px; border-color: var(--line); border-top-color: var(--muted); }
  .item.failed { background: rgba(220, 38, 38, .07); }
  .failbox { display: flex; gap: 6px; flex: none; flex-direction: column; align-items: flex-end; }
  .failbox button { border: 0; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .failbox .retry { background: var(--bad); color: #fff; }
  .failbox .drop { background: var(--chip); color: var(--ink); }
  .row-card { padding: 4px 14px 14px; margin-top: 12px; position: relative; }
  .row-card .rm { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px; }
  .row-card .n { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--field); min-height: 48px; overflow: hidden; }
  .stepper button { width: 44px; height: 46px; border: 0; background: none; font-size: 22px; font-weight: 600; cursor: pointer; color: var(--sky); }
  .stepper output { flex: 1; text-align: center; font-weight: 700; }
  .seg { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 12px; margin-top: 6px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px; border-radius: 9px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .file { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 11px; cursor: pointer; background: var(--field); }
  .file img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  .calc { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .paper { background: #fff; color: #0b1f33; border-radius: 14px; padding: 18px 14px; margin-top: 6px; overflow-x: auto; color-scheme: light; }
  .paper table { font-size: 13px; }

  /* Kun til store skærme (skjult på mobil) */
  .dnav, .dactions, .lhead { display: none; }

  /* ── PC / store skærme ── */
  @media (min-width: 900px) {
    .main .top { padding: 18px 32px 18px; }
    .main .top .in { max-width: 1120px; align-items: center; }
    .main .iconbtn, .main .menu { display: none !important; }
    .dnav { display: flex; gap: 4px; }
    .dnav button { background: rgba(255,255,255,.1); border: 0; color: #fff; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .dnav button:hover { background: rgba(255,255,255,.2); }
    .main .wrap { max-width: 1120px; padding: 28px 32px 48px; display: grid; grid-template-columns: 360px 1fr; gap: 28px; align-items: start; }
    .colL { position: sticky; top: 24px; }
    .main .summary { margin-top: 0; padding: 20px; }
    .main .big .h { font-size: 40px; }
    .dactions { display: grid; gap: 10px; margin-top: 14px; }
    .main .fab { display: none; }
    .main .tabs { margin-top: 0; max-width: 420px; }
    .lhead { display: flex; gap: 12px; padding: 4px 22px 8px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .lhead .c1 { width: 120px; } .lhead .c2 { flex: 1; } .lhead .c3 { width: 200px; text-align: right; } .lhead .c4 { width: 36px; }
    .main .list .item { padding: 12px 22px; }
    .main .list .item:hover { background: rgba(0,159,226,.05); }
    .main .list .date { width: 120px; text-align: left; display: flex; align-items: baseline; gap: 8px; }
    .main .list .date b { display: inline; font-size: 17px; }
    .main .list .date span { font-size: 13px; }
    .main .list .amt { width: 200px; display: flex; justify-content: flex-end; align-items: baseline; gap: 18px; }
    .main .list .amt b { display: inline; }
    .main .list .amt span { font-size: 14px; min-width: 90px; text-align: right; }
    .main .foot { text-align: left; padding-left: 4px; }
    .logoutlink { display: none; }

    /* Ark bliver til vinduer midt på skærmen */
    .sheet-bg { align-items: center; padding: 32px; }
    .sheet { border-radius: 20px; max-height: calc(100vh - 64px); max-width: 600px; box-shadow: 0 24px 80px rgba(0,0,0,.35); animation: pop .16s ease-out; }
    .sheet.wide { max-width: 820px; }
    .sheet footer { border-radius: 0 0 20px 20px; padding-bottom: 14px; }
    .sheet footer .btn { max-width: 360px; margin-left: auto; display: flex; }
    .sheet footer .btnrow { max-width: 420px; margin-left: auto; }
    .sheet footer .sum { text-align: right; max-width: 420px; margin-left: auto; }
    .sheet footer .btnrow .btn { max-width: none; }
    @keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
    .paper { padding: 28px 32px; }
    .paper table { font-size: 14px; }
    .histbtns .btn { max-width: 220px; }

    /* Login */
    .login .card { max-width: 440px; margin-left: auto; margin-right: auto; }
  }

  .btnrow .btn.share { flex: 0 0 auto; padding-left: 16px; padding-right: 16px; }
  /* Udskrift: kun lønsedlen */
  @media print {
    body.printing > *:not(.print-target) { display: none !important; }
    body.printing { background: #fff !important; }
    body.printing .print-target { position: static !important; background: none !important; padding: 0 !important; display: block !important; }
    body.printing .print-target .sheet { max-height: none !important; box-shadow: none !important; background: #fff !important; max-width: none !important; animation: none !important; border-radius: 0 !important; }
    body.printing .print-target header, body.printing .print-target footer { display: none !important; }
    body.printing .print-target .body { overflow: visible !important; padding: 0 !important; }
    body.printing .paper { padding: 0 !important; margin: 0 !important; border-radius: 0 !important; }
  }
  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); background: #0b1f33; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 15px; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); text-align: center; }
  .toast.bad { background: var(--bad); }
  .spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin-top: 22px; }
  .foot a { color: inherit; }

<script>
(function () {
  'use strict';

  var MONTHS = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
  var WD = ['søn','man','tir','ons','tor','fre','lør'];

    var archive = {}; // tidligere sæsoner hentes først, når man trykker på dem
    if (shown) drawHistory(body, shown);
    (shown ? callQuiet : call)('apiGetHistory', token).then(function (res) {
      hist = res; saveCache(); seasons = res.seasons;
      // Tegn igen, hvis det nye svar adskiller sig fra det, der faktisk vises.
      if (JSON.stringify(res) !== JSON.stringify(shown) && document.body.contains(body) && !body._season) drawHistory(body, res);
    }).catch(function (e) { if (!shown) { close(); handle(e); } });

    body._pick = function (y) {
      body._season = y;
      if (y === null) return drawHistory(body, hist);
      if (archive[y]) return drawHistory(body, archive[y]);
      drawHistory(body, { list: [], seasons: seasons, season: y, loading: true });
      call('apiGetHistory', token, y).then(function (res) {
        archive[y] = res;
        if (body._season === y && document.body.contains(body)) drawHistory(body, res);
      }).catch(function (e) { handle(e); });
    };
  }

  function drawHistory(body, res) {
      body.innerHTML = '';
      var ss = res.seasons || [];
      if (ss.length > 1) {
        add(body, h('div', { class: 'chips', style: 'margin-bottom:8px' }, ss.map(function (z) {
          var on = (res.season === undefined ? null : res.season) === z.year;
          return h('button', { class: 'chip' + (on ? ' on' : ''), style: 'text-transform:none;flex:0 0 auto', text: z.label, onclick: function () { if (!on && body._pick) body._pick(z.year); } });
        })));
      }
      if (res.loading) { add(body, h('div', { class: 'card empty', text: 'Henter sæson…' })); return; }
      if (!res.list.length) { add(body, h('div', { class: 'card empty', text: res.season ? 'Ingen udbetalinger i den sæson.' : 'Ingen udbetalinger endnu i denne sæson.' })); return; }
      var years = {};
      res.list.forEach(function (x) { (years[x.year] = years[x.year] || []).push(x); });
      Object.keys(years).sort().reverse().forEach(function (y) {
        var tot = years[y].reduce(function (s, x) { return s + x.total; }, 0);
        add(body, h('div', { class: 'yr' }, h('span', { text: y }), h('span', { text: kr(tot) })));
        add(body, h('div', { class: 'card list' }, years[y].map(function (x) {
          var cls = x.status === 'Udbetalt' ? 'badge ok' : (x.status === 'Åben' ? 'badge sky' : 'badge');
          var extra = [];
          if (x.korsel || x.udlaeg) extra.push('Kørsel/udlæg ' + kr(x.korsel + x.udlaeg));
          return h('div', { class: 'item', style: 'flex-wrap:wrap' },
            h('div', { class: 'what' },
              h('div', { class: 't', style: 'text-transform:capitalize', text: x.label }),
              h('div', { class: 's note', style: 'color:var(--muted)', text: num(x.timer) + ' t · løn ' + kr(x.lon) + (extra.length ? ' · ' + extra.join(' · ') : '') }),
              x.late && x.late.length ? h('div', { class: 's note', text: 'Heraf ' + x.late.map(function (l) { return num(l.timer) + ' t fra ' + l.month; }).join(' og ') + ' (indsendt efter fristen)' }) : null,
              h('div', { class: 's', text: (x.status === 'Udbetalt' ? 'Udbetalt ' : 'Udbetales ') + x.payout }),
              x.ferie > 0 ? h('div', { class: 's', style: 'white-space:normal', text: 'Feriepenge ' + kr(x.ferie) + ' til FerieKonto' }) : null,
              h('span', { class: cls, text: x.status }), x.rettet ? h('span', { class: 'badge warn', style: 'margin-left:6px', text: 'Rettet af kasserer' }) : null),
            h('div', { class: 'amt' }, h('b', { text: kr(x.total) }),
              x.slipId && Math.abs(x.total - x.brutto) > 0.004 ? h('span', { text: 'før skat ' + kr(x.brutto) }) : null),
            h('div', { class: 'histbtns' },
              h('button', { class: 'btn ghost', type: 'button', text: 'Vis træninger ▾', onclick: function (ev) { toggleMonth(ev.currentTarget, x.key); } }),
              x.slipId ? h('button', { class: 'btn ghost', text: x.slipRettet ? '📄 Lønseddel (rettet)' : '📄 Lønseddel', onclick: function () { openPayslip(x.slipId, x.slipHtml); } }) : null));
        })));
      });
      add(body, h('p', { class: 'hint', style: 'text-align:center;margin:16px 0 4px', text: 'Måneder med lønseddel viser det beløb, der er udbetalt. Andre måneder viser beløbet før evt. skat.' }));
  }

  // Træningerne i en måned hentes først, når man folder den ud, og huskes derefter.
  var monthCache = {};
  function toggleMonth(btn, key) {
    var item = btn.closest('.item');
    var box = item.querySelector('.monthbox');
    if (box) { box.remove(); btn.textContent = 'Vis træninger ▾'; return; }
    box = h('div', { class: 'monthbox' });
    item.appendChild(box);
    btn.textContent = 'Skjul træninger ▴';
    function draw(m) {
      box.innerHTML = '';
      if (!m.regs.length && !m.exps.length) { add(box, h('div', { class: 's', text: 'Ingen registreringer.' })); return; }
      m.regs.forEach(function (r) {
        var d = dParts(r.dato);
        add(box, h('div', { class: 'mrow' },
          h('span', { class: 'md', text: r.timer > 0 ? d.day + '. ' + d.mon : '–' }),
          h('span', { class: 'mw' }, r.timer > 0 ? r.hold : 'Ingen timer i måneden',
            r.work !== m.key && r.timer > 0 ? h('small', { text: ' (fra ' + monthName(r.work) + ')' }) : null,
            r.kommentar && r.timer > 0 ? h('small', { text: ' · ' + r.kommentar }) : null,
            r.note ? h('small', { class: 'note', text: ' 💬 ' + r.note }) : null),
          h('span', { class: 'mt', text: r.timer > 0 ? num(r.timer) + ' t' : '' }),
          h('span', { class: 'ma', text: kr(r.belob) })));
      });
      m.exps.forEach(function (x) {
        var d = dParts(x.dato);
        add(box, h('div', { class: 'mrow' },
          h('span', { class: 'md', text: d.day + '. ' + d.mon }),
          h('span', { class: 'mw' }, x.type === 'Kørsel' ? 'Kørsel · ' + x.km + ' km' : 'Udlæg', x.beskrivelse ? h('small', { text: ' · ' + x.beskrivelse }) : null),
          h('span', { class: 'mt', text: '' }),
          h('span', { class: 'ma', text: kr(x.belob) })));
      });
    }
    if (monthCache[key]) return draw(monthCache[key]);
    add(box, h('div', { class: 's', text: 'Henter…' }));
    callQuiet('apiGetMonth', token, key).then(function (m) { monthCache[key] = m; if (document.body.contains(box)) draw(m); })
      .catch(function (e) { box.innerHTML = ''; add(box, h('div', { class: 's', style: 'color:var(--bad)', text: cleanErr(e && e.message) })); });
  }

  // ── Lønseddel ─────────────────────────────────────────────
  function openPayslip(id, cachedHtml) {
    var paper = h('div', { class: 'paper' }, h('div', { class: 'empty', text: 'Henter lønseddel…' }));
    var file = null;
    // Telefon: åbn PDF'en i telefonens egen PDF-visning (derfra kan man gemme i Filer, udskrive og dele).
    // PC: hent filen og/eller udskriv.
    var phone = false;
    try { phone = window.matchMedia('(pointer: coarse)').matches && window.matchMedia('(max-width: 899px)').matches; } catch (e) {}
    var dl = h('button', { class: 'btn primary', text: 'Gør PDF klar…', disabled: true });
    var pr = phone ? null : h('button', { class: 'btn ghost', text: '🖨 Udskriv', disabled: true });
    var close = openSheet('Lønseddel', paper, phone ? dl : h('div', { class: 'btnrow' }, pr, dl), true);
    var bg = paper.closest('.sheet-bg'); if (bg) bg.classList.add('print-target');
    var readyText = phone ? 'Åbn PDF' : '⬇ Hent PDF';

    // Udskriv (PC): browserens egen udskrift af lønsedlen.
    if (pr) pr.onclick = function () {
      document.body.classList.add('printing');
      setTimeout(function () { window.print(); setTimeout(function () { document.body.classList.remove('printing'); }, 500); }, 50);
    };
    dl.onclick = function () {
      if (!file) return;
      var url = URL.createObjectURL(file.blob);
      if (phone) {
        var w = window.open(url, '_blank');
        if (!w) location.href = url; // hvis pop-up blev blokeret
      } else {
        var a = h('a', { href: url, download: file.name });
        document.body.appendChild(a); a.click(); a.remove();
      }
      setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
    };

    // Lønsedlen ligger allerede i historikken – vis den med det samme.
    var shown = cachedHtml ? Promise.resolve({ html: cachedHtml }) : call('apiGetPayslip', token, id);
    shown.then(function (r) {
      paper.innerHTML = String(r.html).replace(/__LOGO__/g, LOGO || ''); // dannet og escapet på serveren
      if (pr) pr.disabled = false;
      // PDF'en laves i baggrunden, mens man kigger – så er den klar, når man trykker.
      callQuiet('apiGetPayslipPdf', token, id).then(function (f) {
        var bin = atob(f.data), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        file = { name: f.name, blob: new Blob([bytes], { type: 'application/pdf' }) };
        dl.disabled = false; dl.textContent = readyText;
      }).catch(function () { dl.disabled = false; dl.textContent = 'Prøv igen'; dl.onclick = function () { close(); openPayslip(id, cachedHtml); }; });
    }).catch(function (e) { close(); handle(e); });
  }

  // ── Ark: kørsel og udlæg ──────────────────────────────────
  function openExpForm(p) {
    var e = { type: 'Kørsel', dato: defaultDate(p), km: '', belob: '', beskrivelse: '' };
    var file = null;
    var body = h('div');
    var err = h('div', { class: 'err' });
    var save = h('button', { class: 'btn primary', text: 'Gem' });

    function draw() {
      body.innerHTML = '';
      var seg = h('div', { class: 'seg' }, ['Kørsel', 'Udlæg'].map(function (t) {
        return h('button', { type: 'button', class: e.type === t ? 'on' : '', text: t, onclick: function () { e.type = t; draw(); } });
      }));
      var date = h('input', { class: 'in-f', type: 'date', value: e.dato, min: data.minDate, max: data.today, oninput: function () { e.dato = date.value; } });
      var calc = h('div', { class: 'calc' });
      var content = [seg, h('label', { class: 'f', text: 'Dato' }), date];
      if (e.type === 'Kørsel') {
        var km = h('input', { class: 'in-f', type: 'number', inputmode: 'numeric', min: '1', step: '1', placeholder: 'Antal km i alt (tur/retur)', value: e.km,
          oninput: function () { e.km = km.value; calc.textContent = km.value ? '= ' + kr(Math.round(+km.value) * data.kmRate) + ' (' + num(data.kmRate) + ' kr/km)' : ''; } });
        content.push(h('label', { class: 'f', text: 'Kilometer' }), km, calc);
        if (e.km) calc.textContent = '= ' + kr(Math.round(+e.km) * data.kmRate);
      } else {
        var bel = h('input', { class: 'in-f', type: 'text', inputmode: 'decimal', placeholder: '0,00', value: e.belob, oninput: function () { e.belob = bel.value; } });
        var fileIn = h('input', { type: 'file', accept: 'image/*,application/pdf', class: 'hidden', onchange: function () { pick(fileIn.files[0]); } });
        var fileBox = h('label', { class: 'file' }, fileIn,
          file && file.preview ? h('img', { src: file.preview, alt: '' }) : h('span', { style: 'font-size:24px', text: '📷' }),
          h('span', null, file ? h('b', { text: file.name }) : 'Tag billede af kvittering eller vælg fil'));
        content.push(h('label', { class: 'f', text: 'Beløb (kr)' }), bel, h('label', { class: 'f', text: 'Kvittering' }), fileBox);
      }
      var besk = h('input', { class: 'in-f', type: 'text', maxlength: '200', value: e.beskrivelse,
        placeholder: e.type === 'Kørsel' ? 'Fx konkurrence i Aarhus' : 'Fx musik til opvisning', oninput: function () { e.beskrivelse = besk.value; } });
      content.push(h('label', { class: 'f', text: e.type === 'Kørsel' ? 'Hvor kørte du hen?' : 'Hvad dækker udlægget?' }), besk, err);
      add(body, h('div', { class: 'card row-card', style: 'padding-top:14px' }, content));
    }

    function pick(f) {
      if (!f) return;
      err.textContent = '';
      if (f.type === 'application/pdf') {
        if (f.size > 8e6) { err.textContent = 'PDF-filen er for stor (max 8 MB).'; return; }
        var r = new FileReader();
        r.onload = function () { file = { name: f.name, mime: f.type, data: String(r.result).split(',')[1] }; draw(); };
        r.readAsDataURL(f);
        return;
      }
      var url = URL.createObjectURL(f);
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, hh = img.naturalHeight, s = Math.min(1, max / Math.max(w, hh));
        var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(hh * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var du = c.toDataURL('image/jpeg', 0.8);
        URL.revokeObjectURL(url);
        file = { name: f.name || 'kvittering.jpg', mime: 'image/jpeg', data: du.split(',')[1], preview: du };
        draw();
      };
      img.onerror = function () { URL.revokeObjectURL(url); err.textContent = 'Billedet kunne ikke læses. Prøv et andet eller tag et skærmbillede.'; };
      img.src = url;
    }

    draw();
    var close = openSheet('Kørsel eller udlæg', body, save);
    save.addEventListener('click', function () {
      err.textContent = '';
      if (!e.dato) { err.textContent = 'Vælg dato.'; return; }
      if (e.type === 'Kørsel' && !(+e.km >= 1)) { err.textContent = 'Skriv antal km.'; return; }
      if (e.type === 'Udlæg' && !(+String(e.belob).replace(',', '.') > 0)) { err.textContent = 'Skriv beløbet.'; return; }
      if (e.type === 'Udlæg' && !file) { err.textContent = 'Vedhæft et billede af kvitteringen.'; return; }
      if (!e.beskrivelse.trim()) { err.textContent = e.type === 'Kørsel' ? 'Skriv hvor du kørte hen.' : 'Skriv hvad udlægget dækker.'; return; }
      busy(save, true);
      call('apiAddExpense', token, { type: e.type, dato: e.dato, km: e.km, belob: e.belob, beskrivelse: e.beskrivelse },
        e.type === 'Udlæg' && file ? { name: file.name, mime: file.mime, data: file.data } : null)
        .then(function (st) { close(); ui.period = e.dato.slice(0, 7); setData(st); toast('Gemt ✓'); })
        .catch(function (x) { busy(save, false, 'Gem'); handle(x, err); });
    });
  }

  // ── Start ─────────────────────────────────────────────────
  // Appen må kun vises direkte eller inde i foreningens egen startside.
  function framedByStranger() {
    var ao = window.location.ancestorOrigins;
    if (!ao || !ao.length) return false;
    for (var i = 0; i < ao.length; i++) {
      var o = ao[i];
      if (o === 'https://script.google.com' || /\.googleusercontent\.com$/.test(o)) continue;
      if (cfg.appOrigin && o === cfg.appOrigin) continue;
      return true;
    }
    return false;
  }

  function showGuard() {
    mount(h('div', { class: 'login' }, h('div', { class: 'wrap', style: 'padding-top:60px' }, h('div', { class: 'card', style: 'padding:20px' },
      h('h2', { style: 'margin-top:0', text: 'Åbn Trænertimer det rigtige sted' }),
      h('p', { text: 'Denne side viser Trænertimer inde i en anden hjemmeside. Skriv aldrig din kode her. Brug linket fra kassereren.' })))));
  }

  token = load(TOKEN_KEY);
  try { var cc = JSON.parse(load(CFG_KEY) || 'null'); if (cc) cfg = cc; } catch (e) {}
  var cached = token ? readCache() : null;
  var notFramed = !(window.location.ancestorOrigins && window.location.ancestorOrigins.length);
  // Ikke logget ind: vis login-siden med det samme – serveren skal ikke vækkes for at vise den.
  if (!token && notFramed) showLogin();
  if (cached && cached.state && cached.cfg) {
    cfg = cached.cfg;
    if (framedByStranger()) { showGuard(); return; }
    hist = cached.history || null;
    setData(cached.state, 'cache');   // vis med det samme – opdateres når serveren svarer
  }
  var shownLogin = !token && notFramed;
  call('apiBoot', token || null).then(function (res) {
    cfg = res.config || cfg;
    store(CFG_KEY, JSON.stringify(cfg));
    if (framedByStranger()) { showGuard(); return; }
    if (!token) { if (!shownLogin) showLogin(); return; }
    if (res.authError) { handle(new Error(res.authError)); return; }
    hist = res.history || null;
    setData(res.state, 'boot');
    flushPending(); // træninger der ikke nåede frem sidst
  }).catch(function (e) {
    if (shownLogin) return; // login-siden virker uden; selve login prøver igen
    if (data) return; // vis bare det senest hentede – det opdateres næste gang
    else { mount(h('div', { class: 'loading' }, h('div', { style: 'text-align:center;padding:24px' }, h('p', { text: e.message }), h('button', { class: 'btn primary', style: 'width:auto', text: 'Prøv igen', onclick: function () { location.reload(); } })))); }
  });
})();
</script>
</body>
</html>
